<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Processing App</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-gray-900 min-h-screen text-gray-100">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-indigo-400 mb-2">Image Processing App</h1>
            <p class="text-gray-400">Upload your images and apply filters</p>
        </header>

        <main class="max-w-2xl mx-auto">
            <!-- Upload Section -->
            <div class="bg-gray-800 rounded-lg shadow-lg p-6 mb-8 border border-gray-700">
                <h2 class="text-2xl font-semibold mb-4 text-indigo-300">Upload Image</h2>
                <form id="uploadForm" class="space-y-4">
                    <div class="border-2 border-dashed border-gray-600 rounded-lg p-6 text-center hover:border-indigo-500 transition-colors duration-200">
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                        <div id="dropZone" class="cursor-pointer">
                            <svg class="mx-auto h-12 w-12 text-gray-500" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <p class="mt-2 text-sm text-gray-400">Drag and drop your image here, or click to select</p>
                            <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
                        </div>
                    </div>
                    <div id="previewContainer" class="hidden">
                        <img id="imagePreview" class="max-h-64 mx-auto rounded-lg shadow-lg" src="" alt="Preview">
                    </div>
                    <div class="flex justify-center">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200 shadow-lg hover:shadow-indigo-500/50">
                            Process Image
                        </button>
                    </div>
                </form>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="hidden bg-gray-800 rounded-lg shadow-lg p-6 border border-gray-700">
                <h2 class="text-2xl font-semibold mb-4 text-indigo-300">Processing Results</h2>
                <div id="statusMessage" class="mb-4 text-gray-300"></div>
                <div id="resultContainer" class="hidden">
                    <img id="processedImage" class="max-h-64 mx-auto rounded-lg shadow-lg" src="" alt="Processed Image">
                    <div class="mt-4 text-center">
                        <a id="downloadLink" href="#" download class="text-indigo-400 hover:text-indigo-300 transition-colors duration-200">
                            Download Processed Image
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="./app.js"></script>
</body>
</html>
