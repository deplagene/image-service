services:
  nsfw-service:
    image: steelcityamir/safe-content-ai:latest
    container_name: nsfw-service-container
    ports:
      - "8000:8000"
  minio:
    image: minio/minio:latest
    container_name: minio-container
    command: server --console-address ":9001" /data/
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  mongo-db:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: deplagene
      MONGO_INITDB_ROOT_PASSWORD: developerdeplagene
    volumes:
      - mongodb_data:/data/db

volumes:
  minio-storage:
  mongodb_data:
